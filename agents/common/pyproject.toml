[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olympus-agent-common"
version = "1.0.9"
requires-python = ">=3.11"
dependencies = ["cryptography>=44,<51"]

[project.optional-dependencies]
local-media = [
  "dbus-next>=0.2.3,<0.3; sys_platform == 'linux'",
  "winrt-Windows.Media.Control>=3,<4; sys_platform == 'win32'",
]
