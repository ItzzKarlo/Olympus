name: Package Olympus Agents

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "agents/**"
      - "scripts/build-agent.py"
      - ".github/workflows/package-agents.yml"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            source: linux
          - os: windows-latest
            source: windows
          - os: macos-14
            source: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Agent and packaging dependencies
        shell: bash
        working-directory: agents/${{ matrix.source }}
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r ../packaging/requirements.txt
      - name: Test shared Agent runtime
        working-directory: agents/common
        run: python -m unittest discover -s tests
      - name: Test platform Agent
        working-directory: agents/${{ matrix.source }}
        run: python -m unittest discover -s tests
      - name: Build and smoke-test native artifact
        run: python scripts/build-agent.py --archive
      - uses: actions/upload-artifact@v4
        with:
          name: olympus-agent-${{ runner.os }}-${{ runner.arch }}
          path: dist/releases/*
          if-no-files-found: error
