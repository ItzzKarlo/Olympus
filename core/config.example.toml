# Olympus v0.8 configuration. Copy to core/config.toml.
core_host_poll_seconds = 5

[olympus]
# IANA timezone used by the room display and calendar interpretation.
timezone = "Europe/Berlin"

[night]
enabled = true
# Midnight starts belong to the end of the named evening: Friday 00:00 means
# the transition from Friday night into Saturday morning.
weekday_start = "22:00"
weekend_start = "00:00"
end = "07:30"
weekend_days = ["friday", "saturday"]

[weather]
enabled = false
# Configure the fixed home location; Olympus never uses browser/IP geolocation.
latitude = 48.137
longitude = 11.575
timezone = "Europe/Berlin"
location_name = "Home"
poll_minutes = 10

[calendar]
enabled = false
provider = "google"
timezone = "Europe/Berlin"
lookahead_days = 7
poll_minutes = 5
calendar_ids = ["primary"]

[network]
enabled = true
poll_seconds = 5
timeout_seconds = 2
gateway = "auto"
gateway_port = 53
internet_host = "1.1.1.1"
internet_port = 443
dns_hostname = "example.com"
https_url = "https://www.cloudflare.com/cdn-cgi/trace"
failure_threshold = 3
recovery_threshold = 2

# Add important LAN or Meshnet targets. Targets are read-only TCP checks.
# [[network.targets]]
# id = "nas"
# name = "Home NAS"
# host = "10.10.0.20"
# port = 443
# alert = true

[service_monitoring]
poll_seconds = 10
timeout_seconds = 3
failure_threshold = 3
recovery_threshold = 2

