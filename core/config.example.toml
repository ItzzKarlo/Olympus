# Olympus v0.10 configuration. Copy to core/config.toml.
core_host_poll_seconds = 5

[olympus]
# IANA timezone used by the room display and calendar interpretation.
timezone = "Europe/Berlin"

[night]
enabled = true
# Midnight starts belong to the end of the named evening: Friday 00:00 means
# the transition from Friday night into Saturday morning.
weekday_start = "22:00"
weekend_start = "00:00"
end = "07:30"
weekend_days = ["friday", "saturday"]

[football]
enabled = false
provider = "api-football"
# Development simulation: set provider = "fixture" and configure
# OLYMPUS_FOOTBALL_FIXTURE_PATH in .env.
# API-Football provider team ID for FC Bayern München.
team_id = "157"
tracked_id = "bayern"
team_name = "FC Bayern München"
team_short_name = "Bayern"
team_code = "FCB"
timezone = "Europe/Berlin"
poll_upcoming_minutes = 30
poll_near_match_minutes = 5
poll_pre_match_seconds = 60
poll_live_seconds = 15
poll_half_time_seconds = 30
poll_post_match_seconds = 60
poll_team_stats_seconds = 60
poll_player_stats_seconds = 60
# Keep the latest trusted live state through brief provider interruptions.
live_stale_seconds = 60
unavailable_seconds = 900
low_quota_remaining = 25
critical_quota_remaining = 5
max_history_samples = 96

[football.matchday]
pre_match_minutes = 60
post_match_minutes = 20

[football.players]
# Stable API-Football player IDs are authoritative. Names also work for local
# development fixtures, but should not be relied on across squad changes.
watched = []
rating_change_threshold = 0.25

[news]
enabled = false
provider = "rss"
poll_minutes = 5
retention_hours = 48
stale_minutes = 15
unavailable_minutes = 60
default_language = "en"
# Configured regions influence local display relevance; Olympus never uses IP geolocation.
local_regions = ["DE"]

[news.presentation]
ambient_limit = 3
news_scene_seconds = 20
major_scene_seconds = 45
cooldown_minutes = 30
notable_threshold = 0.55
important_threshold = 0.68
major_threshold = 0.86

[news.interests]
technology = 1.1
germany = 1.2
world = 1.0
entertainment = 0.7

# Add reputable public RSS/Atom feeds. URLs live only in local configuration.
# [[news.feeds]]
# id = "publisher-world"
# name = "Publisher World"
# url = "https://example.com/world.xml"
# language = "en"
# region = "DE"
# topic = "world"
# trust = 1.0

[weather]
enabled = false
# Configure the fixed home location; Olympus never uses browser/IP geolocation.
latitude = 48.137
longitude = 11.575
timezone = "Europe/Berlin"
location_name = "Home"
poll_minutes = 10

[calendar]
enabled = false
provider = "google"
timezone = "Europe/Berlin"
lookahead_days = 7
poll_minutes = 5
calendar_ids = ["primary"]

[network]
enabled = true
poll_seconds = 5
timeout_seconds = 2
gateway = "auto"
gateway_port = 53
internet_host = "1.1.1.1"
internet_port = 443
dns_hostname = "example.com"
https_url = "https://www.cloudflare.com/cdn-cgi/trace"
failure_threshold = 3
recovery_threshold = 2

# Add important LAN or Meshnet targets. Targets are read-only TCP checks.
# [[network.targets]]
# id = "nas"
# name = "Home NAS"
# host = "10.10.0.20"
# port = 443
# alert = true

[service_monitoring]
poll_seconds = 10
timeout_seconds = 3
failure_threshold = 3
recovery_threshold = 2

# Supported service types are http, https, and tcp.
# [[services]]
# id = "pterodactyl"
# name = "Pterodactyl"
# type = "http"
# url = "http://10.10.0.10:8080/health"
# severity = "warning"

# [[services]]
# id = "minecraft"
# name = "Minecraft"
